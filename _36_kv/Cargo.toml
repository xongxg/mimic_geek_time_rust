[package]
name = "_36_kv"
version = "0.1.0"
edition = "2024"


[[bin]]
name = "kvs"
path = "src/server.rs"


[[bin]]
name = "kvc"
path = "src/client.rs"

[dependencies]
bytes = "1" # 高效处理网络 buffer 的库
dashmap = "4" # 并发 HashMap
http = "0.2" # 我们使用 HTTP status code 所以引入这个类型库
prost = "0.9" # 处理 protobuf 的代码
tracing = "0.1" # 日志处理
sled = "0.34.7"
tokio = { version = "1.47.1", features = ["full"] }
flate2 = "1.1.2"
tracing-subscriber = "0.3" # 日志处理
tempfile = "3.21.0"
anyhow = "1"
thiserror = "1"

[build-dependencies]
prost-build = "0.14.1"